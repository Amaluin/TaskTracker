# ============================================
# NGINX КОНФИГУРАЦИЯ ДЛЯ FLUTTER WEB APP
# ============================================
# Домен: app.bike53.ru
# Путь: /var/www/app.bike53.ru
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name app.bike53.ru;

    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.bike53.ru;

    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/bike53.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bike53.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bike53.ru/chain.pem;

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Корневая директория
    root /var/www/app.bike53.ru;
    index index.html;

    # Логи
    access_log /var/log/nginx/app.bike53.ru.access.log;
    error_log /var/log/nginx/app.bike53.ru.error.log;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json
               application/wasm;

    # Кэширование статических файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Специальная обработка для Flutter Web
    location / {
        try_files $uri $uri/ /index.html;
        
        # Заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # CORS для Supabase
        add_header Access-Control-Allow-Origin "https://api.bike53.ru" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    # Обработка OPTIONS запросов (CORS preflight)
    location ~ ^/(.*)$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://api.bike53.ru";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Access-Control-Max-Age 3600;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Отключить логирование для favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Отключить логирование для robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
