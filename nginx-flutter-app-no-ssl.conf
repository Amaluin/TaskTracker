# ============================================
# NGINX КОНФИГУРАЦИЯ ДЛЯ FLUTTER WEB APP
# БЕЗ SSL (временно)
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name app.bike53.ru;

    # Корневая директория
    root /var/www/app.bike53.ru;
    index index.html;

    # Логи
    access_log /var/log/nginx/app.bike53.ru.access.log;
    error_log /var/log/nginx/app.bike53.ru.error.log;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json
               application/wasm;

    # Кэширование статических файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Специальная обработка для Flutter Web
    location / {
        try_files $uri $uri/ /index.html;
        
        # Заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Отключить логирование для favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Отключить логирование для robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
